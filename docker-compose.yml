services:
  lightrag:
    image: ghcr.io/hkuds/lightrag:latest
    build:
      context: .
      dockerfile: Dockerfile
      tags:
        - ghcr.io/hkuds/lightrag:latest
    ports:
      - "${HOST:-0.0.0.0}:${PORT:-9621}:9621"
    volumes:
      - ./data/rag_storage:/app/data/rag_storage
      - ./data/inputs:/app/data/inputs
      - ./data/prompts:/app/data/prompts
      # Optional user-defined UI content bundle (welcome page, login blurb
      # and user agreement, query empty state, brand logo). Read-only: the
      # server only ever reads it. See docs/UserDefinedUI.md.
      - ./data/ui_templates:/app/data/ui_templates:ro
      - ./.env:/app/.env
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 10
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WORKING_DIR: "/app/data/rag_storage"
      INPUT_DIR: "/app/data/inputs"
      PROMPT_DIR: "/app/data/prompts"
      # The container must listen on 0.0.0.0 to be reachable via the published port.
      # SECURITY: set LIGHTRAG_API_KEY (or AUTH_ACCOUNTS with TOKEN_SECRET) in .env
      # so the exposed server is authenticated — without it every endpoint is public.
      HOST: "0.0.0.0"
      PORT: "9621"
      # Loads user-defined UI content from the read-only bundle mounted above.
      # Inert until ./data/ui_templates holds a bundle: with no manifest.json
      # in it the server logs a warning and keeps the built-in LightRAG
      # branding. Once a manifest.json is there an invalid bundle makes the
      # server refuse to start. Written as a DEFAULT, not an override: a
      # compose `environment:` entry outranks the same key in .env, so the
      # interpolation hands UI_TEMPLATES_DIR back to .env whenever it sets one
      # (a CONTAINER path there — .env is mounted into the container).
      # See docs/UserDefinedUI.md.
      UI_TEMPLATES_DIR: "${UI_TEMPLATES_DIR:-/app/data/ui_templates}"
