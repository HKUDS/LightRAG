{{- /* A StatefulSet provisions its storage through volumeClaimTemplates */ -}}
{{- if and .Values.persistence.enabled (eq (include "lightrag.workloadKind" .) "Deployment") }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "lightrag.fullname" . }}-rag-storage
  labels:
    {{- include "lightrag.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.ragStorage.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "lightrag.fullname" . }}-inputs
  labels:
    {{- include "lightrag.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.inputs.size }}
{{- end }}
