name: PostgreSQL Smoke Tests

on:
  push:
    branches: [ main, dev, 'dev-*' ]
    # Keep both event filters aligned: PG code, shared dependencies, and CI inputs.
    paths:
      - 'lightrag/kg/pgtable_impl.py'
      - 'lightrag/kg/postgres_impl.py'
      - 'lightrag/kg/__init__.py'
      - 'lightrag/kg/shared_storage.py'
      - 'lightrag/kg/pipeline_ingress.py'
      - 'lightrag/kg/scan_job_store.py'
      - 'lightrag/base.py'
      - 'lightrag/utils.py'
      - 'lightrag/types.py'
      - 'lightrag/constants.py'
      - 'lightrag/exceptions.py'
      - 'lightrag/namespace.py'
      - 'lightrag/pipeline_metrics.py'
      - 'lightrag/__init__.py'
      - 'tests/kg/pgtable_impl/**'
      - 'tests/kg/postgres_impl/**'
      - 'conftest.py'
      - 'tests/conftest.py'
      - 'tests/kg/conftest.py'
      - 'pyproject.toml'
      - 'setup.py'
      - 'MANIFEST.in'
      - '.github/workflows/pg-smoke.yml'
  pull_request:
    branches: [ main, dev, 'dev-*' ]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'lightrag/kg/pgtable_impl.py'
      - 'lightrag/kg/postgres_impl.py'
      - 'lightrag/kg/__init__.py'
      - 'lightrag/kg/shared_storage.py'
      - 'lightrag/kg/pipeline_ingress.py'
      - 'lightrag/kg/scan_job_store.py'
      - 'lightrag/base.py'
      - 'lightrag/utils.py'
      - 'lightrag/types.py'
      - 'lightrag/constants.py'
      - 'lightrag/exceptions.py'
      - 'lightrag/namespace.py'
      - 'lightrag/pipeline_metrics.py'
      - 'lightrag/__init__.py'
      - 'tests/kg/pgtable_impl/**'
      - 'tests/kg/postgres_impl/**'
      - 'conftest.py'
      - 'tests/conftest.py'
      - 'tests/kg/conftest.py'
      - 'pyproject.toml'
      - 'setup.py'
      - 'MANIFEST.in'
      - '.github/workflows/pg-smoke.yml'
  workflow_dispatch:

jobs:
  pg-smoke:
    name: PostgreSQL ${{ matrix.pg }}
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        pg: ['18']
      fail-fast: false

    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_USER: lightrag
          POSTGRES_PASSWORD: lightrag_smoke
          POSTGRES_DB: lightrag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lightrag -d lightrag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: lightrag
      POSTGRES_PASSWORD: lightrag_smoke
      POSTGRES_DATABASE: lightrag_test

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[api]"
          uv pip install --system pytest pytest-asyncio asyncpg

      - name: Run pg_smoke tests
        run: |
          pytest tests/kg/pgtable_impl/test_pgtable_smoke.py -m pg_smoke --run-integration -v --tb=short
