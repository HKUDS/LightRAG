name: PostgreSQL Smoke Tests

on:
  push:
    branches: [ main, dev, 'dev-*' ]
    # One list for both events (the pull_request filter aliases it). It names
    # every lightrag module the smoke tests run against a real PostgreSQL:
    # the PG backends, the shared storage layer, the configuration storage
    # that initialize_storages binds on PG, and the startup migration,
    # deletion purge and rebuild flows the anchor smoke drives end to end.
    # Modules the tests only import, or run on a non-PG backend, are left out.
    paths: &pg_smoke_paths
      # PG backends and the startup migration they serve
      - 'lightrag/kg/pgtable_impl.py'
      - 'lightrag/kg/postgres_impl.py'
      - 'lightrag/storage_migrations.py'
      # Shared storage layer
      - 'lightrag/kg/__init__.py'
      - 'lightrag/kg/shared_storage.py'
      - 'lightrag/kg/pipeline_ingress.py'
      - 'lightrag/kg/scan_job_store.py'
      # Configuration storage bound on PG by initialize_storages
      - 'lightrag/config_store.py'
      - 'lightrag/config_anchor.py'
      - 'lightrag/config_shards.py'
      - 'lightrag/kg/anchor_lock.py'
      # Startup, deletion purge and rebuild flows
      - 'lightrag/lightrag.py'
      - 'lightrag/operate.py'
      - 'lightrag/utils_pipeline.py'
      - 'lightrag/vector_space_gate.py'
      - 'lightrag/kg/vector_space.py'
      # Core definitions every module above depends on
      - 'lightrag/base.py'
      - 'lightrag/utils.py'
      - 'lightrag/types.py'
      - 'lightrag/constants.py'
      - 'lightrag/exceptions.py'
      - 'lightrag/namespace.py'
      - 'lightrag/pipeline_metrics.py'
      - 'lightrag/__init__.py'
      # Tests and their fixtures
      - 'tests/kg/pgtable_impl/**'
      - 'tests/kg/postgres_impl/**'
      - 'conftest.py'
      - 'tests/conftest.py'
      - 'tests/_log_capture.py'
      - 'tests/kg/conftest.py'
      # Packaging and CI inputs
      - 'pyproject.toml'
      - 'setup.py'
      - 'MANIFEST.in'
      - '.github/workflows/pg-smoke.yml'
  pull_request:
    branches: [ main, dev, 'dev-*' ]
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *pg_smoke_paths
  workflow_dispatch:

# A new push to a pull request cancels that PR's runs still in progress, so
# superseded commits stop holding runner slots. Push, dispatch and other events
# group by run id and are never cancelled: every commit on main is still tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  pg-smoke:
    name: PostgreSQL ${{ matrix.pg }}
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        pg: ['18']
      fail-fast: false

    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_USER: lightrag
          POSTGRES_PASSWORD: lightrag_smoke
          POSTGRES_DB: lightrag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lightrag -d lightrag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: lightrag
      POSTGRES_PASSWORD: lightrag_smoke
      POSTGRES_DATABASE: lightrag_test

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[api]"
          uv pip install --system pytest pytest-asyncio asyncpg

      - name: Run pg_smoke tests
        run: |
          pytest tests/kg/pgtable_impl/test_pgtable_smoke.py \
            tests/kg/postgres_impl/test_postgres_anchor_migration_smoke.py \
            -m pg_smoke --run-integration -v --tb=short
