name: Backend Offline Unit Tests

on:
  # No paths filter on either trigger: the suite reads files from all over the
  # tree (docs, WebUI source, compose and k8s presets), and an allowlist of
  # them drifts silently as tests are added. Every PR runs the full backend
  # suite (AGENTS.md, Testing), and so does every push, which is what catches
  # two PRs that pass separately but break together.
  push:
    branches: [ main, dev, 'dev-*' ]
  pull_request:
    branches: [ main, dev, 'dev-*' ]
    types: [opened, synchronize, reopened, ready_for_review]

# A new push to a pull request cancels that PR's runs still in progress, so
# superseded commits stop holding runner slots. Push, dispatch and other events
# group by run id and are never cancelled: every commit on main is still tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Offline Tests (${{ matrix.python-version }}, ${{ matrix.shard }})
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    env:
      # The suite is split by directory into shards that run as parallel
      # jobs, because a single job spends ~5 minutes in pytest and xdist does
      # not help on these runners (see "Run offline tests" below). Directory
      # shards beat per-test splitting here: each job collects only its own
      # directories, while a per-test split would pay the whole collection
      # (~45 s) in every job.
      #
      # These variables are the ONLY list of explicit shards. The "rest"
      # shard runs tests/ minus every directory listed here, so a new test
      # directory or top-level test file lands in "rest" by default and
      # nothing can fall between shards. To rebalance, move a directory
      # between variables (keep each SHARD_<name> in the matrix below);
      # per-shard durations are visible in the job timings. Measured split
      # (serial test time): ~25% of the suite per shard.
      SHARD_parser: tests/parser tests/chunker tests/utils
      SHARD_pipeline: tests/pipeline tests/config_store tests/workspace
      SHARD_api_llm: tests/api tests/llm

    strategy:
      # Let every shard finish, so one failure shows all failing shards.
      fail-fast: false
      matrix:
        # Pull requests test 3.12 only (the Docker images' runtime), to keep
        # the number of concurrent jobs per PR push low. Pushes to main/dev
        # add 3.11 (the requires-python floor) and 3.14 (the newest
        # interpreter), so a change that breaks only one of them is caught
        # right after it merges.
        python-version: ${{ fromJSON(github.event_name == 'push' && '["3.11", "3.12", "3.14"]' || '["3.12"]') }}
        shard: [parser, pipeline, api_llm, rest]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7  # no floating major tag exists past v7
      with:
        # Pinned so `--locked` below compares uv.lock against one known
        # resolver: lockfile output (e.g. marker normalization) can change
        # between uv releases, and an unpinned "latest" could fail or pass a
        # PR for reasons unrelated to it. 0.13.7 is the uv Dependabot's uv
        # ecosystem currently runs; uv 0.11.0 through 0.13.7 all accept the
        # current uv.lock. Bump deliberately, here, in evaluation-tests.yml
        # and in setup-tests.yml.
        version: "0.13.7"
        enable-cache: true

    - name: Install dependencies (locked)
      # --locked installs the exact versions pinned in uv.lock AND fails if
      # uv.lock is out of date with pyproject.toml. --frozen (used before)
      # skipped that check, so a dependency bump that edited pyproject.toml
      # without regenerating uv.lock stayed green while CI kept installing
      # the OLD locked version. Fix such a failure with `uv lock` and commit
      # uv.lock. offline-storage/offline-llm bring the
      # mock-target libraries (qdrant-client, pymongo, anthropic, boto3, ...)
      # the offline suite constructs data classes from; the pytest extra brings
      # pytest/pytest-asyncio/httpx2. Without them importorskip silently skips.
      # The evaluation extra is deliberately NOT installed here; it has its
      # own path-filtered workflow, evaluation-tests.yml.
      run: >-
        uv sync --locked --python ${{ matrix.python-version }}
        --extra api --extra offline-storage --extra offline-llm --extra pytest

    - name: Run offline tests (${{ matrix.shard }})
      # Run only tests marked as 'offline' (no external dependencies);
      # integration tests requiring databases/APIs are skipped by default.
      # --no-sync: the environment was already synced above.
      # Serial within each shard on purpose: pytest-xdist was measured on
      # these 4-vCPU hosted runners at 2 and 4 workers and never beat the
      # serial run (per-worker collection alone costs ~50 s). Parallelism
      # comes from the shards instead. Use -n auto locally.
      # tests/setup is skipped by norecursedirs (pyproject.toml) and runs in
      # setup-tests.yml, only when a wizard input changes.
      env:
        SHARD: ${{ matrix.shard }}
      run: |
        if [ "$SHARD" = rest ]; then
          args="tests/"
          for dir in $SHARD_parser $SHARD_pipeline $SHARD_api_llm; do
            args="$args --ignore=$dir"
          done
        else
          var="SHARD_$SHARD"
          args="${!var:?no directory list for shard $SHARD}"
        fi
        echo "pytest paths: $args"
        uv run --no-sync pytest $args -m offline -v --tb=short

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-py${{ matrix.python-version }}-${{ matrix.shard }}
        path: |
          .pytest_cache/
          test-results.xml
        retention-days: 7
