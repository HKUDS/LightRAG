name: Offline Unit Tests

on:
  push:
    branches: [ main, dev, 'dev-*' ]
  pull_request:
    branches: [ main, dev, 'dev-*' ]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  offline-tests:
    name: Offline Tests
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Pull requests test 3.12 (the Docker images' runtime) and 3.14 (the
        # newest interpreter). Pushes to main/dev add 3.11, the
        # requires-python floor, so a change that only breaks the floor is
        # caught right after it merges without adding a third job to every PR.
        python-version: ${{ fromJSON(github.event_name == 'push' && '["3.11", "3.12", "3.14"]' || '["3.12", "3.14"]') }}

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7  # no floating major tag exists past v7
      with:
        # Pinned so `--locked` below compares uv.lock against one known
        # resolver: lockfile output (e.g. marker normalization) can change
        # between uv releases, and an unpinned "latest" could fail or pass a
        # PR for reasons unrelated to it. 0.13.7 is the uv Dependabot's uv
        # ecosystem currently runs; uv 0.11.0 through 0.13.7 all accept the
        # current uv.lock. Bump deliberately, here, in evaluation-tests.yml
        # and in setup-tests.yml.
        version: "0.13.7"
        enable-cache: true

    - name: Install dependencies (locked)
      # --locked installs the exact versions pinned in uv.lock AND fails if
      # uv.lock is out of date with pyproject.toml. --frozen (used before)
      # skipped that check, so a dependency bump that edited pyproject.toml
      # without regenerating uv.lock stayed green while CI kept installing
      # the OLD locked version. Fix such a failure with `uv lock` and commit
      # uv.lock. offline-storage/offline-llm bring the
      # mock-target libraries (qdrant-client, pymongo, anthropic, boto3, ...)
      # the offline suite constructs data classes from; the pytest extra brings
      # pytest/pytest-asyncio/httpx2. Without them importorskip silently skips.
      # The evaluation extra is deliberately NOT installed here; it has its
      # own path-filtered workflow, evaluation-tests.yml.
      run: >-
        uv sync --locked --python ${{ matrix.python-version }}
        --extra api --extra offline-storage --extra offline-llm --extra pytest

    - name: Run offline tests
      # Run only tests marked as 'offline' (no external dependencies);
      # integration tests requiring databases/APIs are skipped by default.
      # --no-sync: the environment was already synced above.
      # Serial on purpose: pytest-xdist was measured on these 4-vCPU hosted
      # runners at 2 and 4 workers and never beat the serial run (per-worker
      # collection alone costs ~50 s). Use -n auto locally instead.
      # tests/setup is skipped by norecursedirs (pyproject.toml) and runs in
      # setup-tests.yml, only when a wizard input changes.
      run: uv run --no-sync pytest tests/ -m offline -v --tb=short

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-py${{ matrix.python-version }}
        path: |
          .pytest_cache/
          test-results.xml
        retention-days: 7
